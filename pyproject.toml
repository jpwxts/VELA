[project]
name = "vela"
version = "0.1.0"
description = "Vela — The Fire Time Machine. Harmonize MODIS and VIIRS active-fire observations."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "joblib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyproj",
    "python-dotenv",
    "scikit-learn",
    "shapely",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
